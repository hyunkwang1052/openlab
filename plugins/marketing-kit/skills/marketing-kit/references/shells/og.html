<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0; padding:0;}
  body{
    width:1200px;
    height:630px;
    background:#12161C;
    color:#F1EFEA;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .lockup{display:flex; flex-direction:column; align-items:flex-start; gap:26px;}
  .row{display:flex; align-items:center; gap:26px;}
  .row svg{width:96px; height:96px; color:#8CA3BE;}
  .row b{font-weight:900; font-size:96px; letter-spacing:-.02em; color:#F1EFEA;}
  .slogan{font-weight:700; font-size:38px; letter-spacing:-.01em; color:#E3A868; margin:0;}
</style>
</head>
<body>
  <div class="lockup">
    <div class="row">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M39 9a8 8 0 1 1 0 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
        <rect x="5" y="47" width="54" height="7" rx="2.5" fill="currentColor"/>
        <rect x="9" y="36" width="44" height="7" rx="2.5" fill="currentColor" opacity="0.8"/>
        <rect x="15" y="25" width="32" height="7" rx="2.5" fill="currentColor" opacity="0.6"/>
        <rect x="21" y="14" width="20" height="7" rx="2.5" fill="currentColor" opacity="0.45"/>
      </svg>
      <b>새벽결</b>
    </div>
    <p class="slogan">쌓이면, 보인다</p>
  </div>
</body>
</html>
